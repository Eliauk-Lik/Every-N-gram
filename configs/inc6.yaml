model: data/models/Qwen3-0.6B
dtype: float32
out: reports/inc6
corpora:
  - name: stdlib
    root: 'data/python-stdlib'
    exclude: ['site-packages', 'test']
  - name: site-packages
    root: 'data/python-stdlib/site-packages'
    exclude: ['test']
max_files: 40
orders: [1, 2, 3]
folds: 4
gates:
  - {min_order: 1, min_share: 0.5, max_top_prob: 0.9}
  - {min_order: 2, min_share: 0.5, max_top_prob: 1.0}
  - {min_order: 1, min_share: 0.0, max_top_prob: 0.7}
lambdas: [0.02, 0.05]
min_coverage: 0.25
dev_cases: 24
test_cases: 24
gamma: 4
prefix_tokens: 8
timing_tokens: 32
repeats: 1
